{% extends "base2.html" %}

{% block start %}

<div class="container mt-5">
    <form class="col-6 mx-auto card p-3 shadow-lg" method="POST" enctype="multipart/form-data">

        {% csrf_token %}
        <h2>Add Recipe</h2>
        <hr>
        <div class="mb-3">
            <label for="recipe-name">Recipe Name</label>
            <input name="recipe_name" type="text" required class="form-control" id="recipe-name">
        </div>

        <div class="mb-3">
            <label for="recipe-desc">Recipe Description</label>
            <input name="recipe_desciption" type="textarea" required class="form-control" id="recipe-desc">
        </div>

        <div class="mb-3">
            <label for="recipe-image">Recipe Image</label>
            <input name="recipe_image" type="file" class="form-control" id="recipe-name">
        </div>

        <button type="submit" class="btn btn-success mb-3">Submit</button>

        </form>
</div>

<div class="container mt-5">
  <form>
    <hr>
    <div class="mb-3">
      <label for="search" class="form-label">Search</label>
      <input type="text" name="search-recipe" class="form-control"/>
    </div>

    <button type="submit" class="btn btn-primary m-2">Search</button>

  </form>
</div>


<!-- Recipe Table -->
 <table class="table container mt-5">
  <thead>
    <tr>
      <th scope="col">ID</th>
      <th scope="col">Recipe Name</th>
      <th scope="col">Recipe Description</th>
      <th scope="col">Recipe Image</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    {% for recipe in recipes %}
    <tr>
      <th scope="row">{{forloop.counter}}</th>
      <td>{{recipe.receipe_name}}</td>
      <td>{{recipe.receipe_description}}</td>
      <td>
        <img src="/media/{{recipe.recipe_image}}" style="height:100px"> </img>
      </td>
      <td>
        <a href="/delete-recipe/{{recipe.id}}/" class="btn btn-danger">Delete</a>
        <a href="/update-recipe/{{recipe.id}}" class="btn btn-success m-2">Update</a>
      </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
