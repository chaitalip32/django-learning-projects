{% extends "base2.html"%}
{% block start%}
<div class="container mt-5">
    <form class="col-6 mx-auto card p-3 shadow-lg" method="POST">
        {% csrf_token %}
        <h2>Register</h2>
        <hr>

        {% if messages %}

        <div class="alert alert-primary" role="alert">
            {% for message in messages %}
                {{ message }}
            {% endfor %}
        </div>

        {% endif %}

        <div class="form-group">
            <label for="exampleInputEmail1">First Name</label>
            <input name="first_name" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" >           
        </div>
        <div class="form-group">
            <label for="exampleInputEmail1">Last Name</label>
            <input  name="last_name" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"">          
        </div>
        <div class="form-group">
            <label for="exampleInputEmail1">Email address</label>
            <input type="email" name="username" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
            
        </div>
        <div class="form-group">
            <label for="exampleInputPassword1">Password</label>
            <input type="password" name="pass" class="form-control" id="exampleInputPassword1">
        </div>

        <p>Already have an account <a href="/login/">Login</a></p>
        <button type="submit" class="btn btn-primary">Register</button>
     </form>
</div>  
{% endblock %}
